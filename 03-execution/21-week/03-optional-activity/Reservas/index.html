<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Citas</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <form id="formCita">
    <h2>Agendar Cita</h2>

    <label>Tipo Documento:</label>
    <input type="text" id="type_document" value="CC">

    <label>Documento:</label>
    <input type="text" id="document" placeholder="Número de documento">

    <label>Nombre:</label>
    <input type="text" id="name" placeholder="Nombre completo">

    <label>Dirección:</label>
    <input type="text" id="address" placeholder="Dirección">

    <label>Teléfono:</label>
    <input type="text" id="phone" placeholder="Teléfono">

    <label>Email:</label>
    <input type="email" id="email" placeholder="Correo electrónico">

    <hr>

    <label>Motivo Cita:</label>
    <input type="text" id="res_name" placeholder="Ej: Consulta odontológica">

    <label>Descripción:</label>
    <input type="text" id="description" placeholder="Detalle adicional">

    <button type="submit">Guardar Cita</button>
    <p id="respuesta"></p>
  </form>

  <script type="module" src="app.js"></script>
</body>
</html>
